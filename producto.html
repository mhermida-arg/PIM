                    PIM

            <!-- Tabs / Píldoras Centrales -->

                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 00-1 1m-6 0h6"></path></svg>
                    <span>Inicio</span>
                </a>
                <a href="catalogo.html" class="flex items-center gap-2 px-5 py-1.5 rounded-full bg-white text-slate-900 shadow-sm transition-all">
                    <svg class="w-4 h-4 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>

                </button>

                <a href="#guardados" title="Guardados" class="flex items-center gap-1.5 p-2 sm:px-3 sm:py-2 rounded-full text-slate-600 hover:bg-slate-100 transition-colors text-sm font-medium">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </a>

                <div class="h-6 w-[1px] bg-slate-200 mx-1"></div>

                <div class="flex items-center gap-2.5 pl-1 cursor-pointer group">
                    <div class="w-9 h-9 rounded-full bg-slate-900 text-white font-semibold text-xs flex items-center justify-center ring-2 ring-slate-200 group-hover:ring-brand-500 transition-all">
                        MH
                    </div>
                    <div class="hidden lg:flex flex-col text-left">
                        <span class="text-xs font-bold text-slate-800 leading-snug">Martina H.</span>
                        <span class="text-[10px] text-slate-500">Administrador</span>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 lg:px-8 py-8 w-full flex-grow" id="appContainer">
        <!-- ESTADO DE CARGA INITIAL -->
        <div class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="w-10 h-10 border-4 border-brand-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-slate-500 text-sm font-semibold">Cargando ficha del producto...</p>
        </div>
    </main>

    <!-- PLANTILLA DINÁMICA DE PRODUCTO -->
    <template id="productoTemplate">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-xs font-medium text-slate-500 mb-6 flex-wrap">
            <a href="index.html" class="hover:text-brand-600 transition-colors">Inicio</a>
            <span>/</span>
            <a href="catalogo.html" class="hover:text-brand-600 transition-colors">Catálogo</a>
            <span>/</span>
            <a href="#" id="bcMarca" class="hover:text-brand-600 transition-colors font-semibold text-slate-700">Marca</a>
            <span>/</span>
            <span class="text-slate-900 font-bold truncate max-w-xs sm:max-w-md" id="bcActual">Cargando...</span>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- COLUMNA IZQUIERDA: SIDEBAR / FOTO & VARIANTES -->
            <div class="lg:col-span-4 bg-white rounded-2xl border border-slate-200/90 p-5 shadow-sm space-y-6">
                
                <!-- Imagen Principal -->
                <div class="w-full h-72 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center p-4 relative overflow-hidden group">
                    <img id="mainProductImg" src="" alt="Producto" class="max-h-64 max-w-full object-contain mix-blend-multiply transition-transform duration-300 group-hover:scale-105">
                </div>

                <!-- Meta Info / Badges -->
                <div class="space-y-2.5 pb-4 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <a href="#" id="uiMarcaBadge" class="px-3 py-1 rounded-md text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-800 hover:bg-brand-50 hover:text-brand-600 transition-colors">Marca</a>
                        <span id="uiEstado" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200/60">Activo</span>
                    </div>

                    <div class="text-xs text-slate-600 space-y-1 pt-1">
                        <div class="flex justify-between">
                            <span class="text-slate-400 font-medium">SKU Padre:</span>
                            <strong id="uiSkuPadre" class="text-slate-800 font-semibold">...</strong>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400 font-medium">SKU Variante:</span>
                            <strong id="uiSkuVariante" class="text-brand-600 font-semibold">Seleccioná un color</strong>
                        </div>
                    </div>
                </div>

                <!-- Variantes de Color -->
                <div class="space-y-3 pb-4 border-b border-slate-100">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Variantes de Color</h4>
                    <div class="flex flex-wrap gap-2" id="uiVariantesContainer">
                        <!-- Carga dinámica vía JS -->
                    </div>
                </div>

                <!-- Acciones Rápidas -->
                <div class="space-y-2">
                    <a id="btnFtp" href="#" target="_blank" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs flex items-center justify-center gap-2 transition-all shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                        <span>Carpeta FTP Completa</span>
                    </a>
                    
                    <a id="btnWeb" href="#" target="_blank" class="w-full py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs flex items-center justify-center gap-2 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        <span>Web Oficial</span>
                    </a>

                    <a id="btnStock" href="#" target="_blank" class="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs flex items-center justify-center gap-2 transition-all shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>

                    </a>

                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug mb-6" id="uiNombre">
                    Nombre Comercial del Producto
                </h1>

                <!-- BARRA DE PESTAÑAS (TAB NAV) -->
                <nav class="flex items-center gap-1 border-b border-slate-200/80 mb-6 overflow-x-auto pb-px">
                    <button class="tab-btn px-4 py-2.5 rounded-t-xl font-bold text-xs sm:text-sm text-slate-500 hover:text-brand-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent active" onclick="openTab(event, 'tab-informacion')">

                        <span>Información</span>
                    </button>

                    <button class="tab-btn px-4 py-2.5 rounded-t-xl font-bold text-xs sm:text-sm text-slate-500 hover:text-brand-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent" onclick="openTab(event, 'tab-catalogacion')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span>Catalogación</span>
                    </button>

                    <button class="tab-btn px-4 py-2.5 rounded-t-xl font-bold text-xs sm:text-sm text-slate-500 hover:text-brand-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent" onclick="openTab(event, 'tab-fotos')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>

                    </button>

                    <button class="tab-btn px-4 py-2.5 rounded-t-xl font-bold text-xs sm:text-sm text-slate-500 hover:text-brand-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent" onclick="openTab(event, 'tab-archivos')">

                    </button>

                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <span>Desarrollo</span>
                    </button>
                </nav>

                <!-- PESTAÑA 1: INFORMACIÓN -->
                <div id="tab-informacion" class="tab-panel space-y-6">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Datos Universales</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Peso</span>
                            <span class="text-sm font-bold text-slate-800 mt-0.5 block" id="uiPeso">-</span>
                        </div>
                        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Dimensión Armado</span>
                            <span class="text-sm font-bold text-slate-800 mt-0.5 block" id="uiDimArmado">-</span>
                        </div>
                        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Dimensión Bulto</span>

                        </div>
                        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Destacado 1</span>
                            <span class="text-sm font-bold text-slate-800 mt-0.5 block" id="uiDestacado1">-</span>
                        </div>
                        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Destacado 2</span>
                            <span class="text-sm font-bold text-slate-800 mt-0.5 block" id="uiDestacado2">-</span>
                        </div>
                        <div class="p-3.5 bg-slate-50 rounded-xl border border-slate-100">
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Lineal</span>
                            <span class="text-sm font-bold text-slate-800 mt-0.5 block" id="uiLineal">-</span>
                        </div>
                    </div>

                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 pt-4">Especificaciones Extendidas</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="uiFichaExtendida">
                        <!-- Clave:Valor cargados dinámicamente -->
                    </div>
                </div>

                <!-- PESTAÑA 2: CATALOGACIÓN -->
                <div id="tab-catalogacion" class="tab-panel hidden space-y-6">
                    
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-brand-600 flex items-center gap-2">
                            <span>📌 Bullet Points (Puntos Clave)</span>
                        </h4>
                        <div class="text-xs text-slate-700 whitespace-pre-line leading-relaxed font-medium" id="uiBullets">-</div>
                    </div>

                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-brand-600 flex items-center gap-2">
                            <span>📝 Descripción Larga (Web / E-commerce)</span>
                        </h4>
                        <div class="text-xs text-slate-700 whitespace-pre-line leading-relaxed" id="uiDescLarga">-</div>
                    </div>

                    <div class="space-y-3">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Códigos y Enlaces E-Commerce</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-500">SKU Padre:</span>
                                <code class="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-800" id="catSkuPadre">-</code>
                            </div>
                            <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-500">SKU Variante:</span>
                                <code class="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-brand-600" id="catSkuVariante">-</code>
                            </div>
                            <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-500">Código EAN:</span>
                                <code class="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-800" id="catEan">-</code>
                            </div>
                            <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between">
                                <span class="text-xs font-medium text-slate-500">Enlace Web Oficial:</span>
                                <a href="#" id="catWebLink" target="_blank" class="text-xs font-bold text-brand-600 hover:underline flex items-center gap-1">

                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </a>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="uiGalleryContainer">

                    </div>

                                <div class="w-8 h-8 rounded-lg bg-red-100 text-red-600 flex items-center justify-center font-bold text-xs">PDF</div>

    <!-- LÓGICA JAVASCRIPT Y CONEXIÓN CON AIRTABLE -->
    <script>
        const AIRTABLE_TOKEN = "patsRhUUmBYhyRU6v.fc25941b8835fac901831978042e8ecb21c32a4a2cd68c20eef1ddc42a3478f3";
        const AIRTABLE_BASE_ID = "app7o9ehVEoXUVmQo";

        const urlParams = new URLSearchParams(window.location.search);
        const skuPadreURL = urlParams.get('sku');

        async function cargarFicha() {
            if (!skuPadreURL) {
                document.getElementById('appContainer').innerHTML = `
                    <div class="max-w-md mx-auto my-12 p-8 bg-white rounded-2xl border border-slate-200 text-center shadow-sm">
                        <div class="text-3xl mb-3">⚠️</div>
                        <h3 class="text-lg font-bold text-slate-900 mb-2">Producto no especificado</h3>
                        <p class="text-xs text-slate-500 mb-6">No se indicó ningún SKU en la URL de navegación.</p>
                        <a href="index.html" class="inline-flex items-center px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs rounded-xl transition-all">Volver al inicio</a>
                    </div>`;
                return;
            }

            const formula = encodeURIComponent(`{SKU Padre} = '${skuPadreURL}'`);
            const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/Productos%20Padre?filterByFormula=${formula}`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` }});
                const data = await res.json();

                if (data.records && data.records.length > 0) {
                    const producto = data.records[0].fields;
                    renderizarProducto(producto);

                    const idsVariantes = producto['Variantes'] || [];
                    if(idsVariantes.length > 0) {
                        buscarVariantes(idsVariantes);
                    } else {
                        document.getElementById('uiVariantesContainer').innerHTML = "<span class='text-xs text-slate-400'>Producto único (sin variantes de color)</span>";
                    }
                } else {
                    document.getElementById('appContainer').innerHTML = `
                        <div class="max-w-md mx-auto my-12 p-8 bg-white rounded-2xl border border-slate-200 text-center shadow-sm">
                            <div class="text-3xl mb-3">❌</div>
                            <h3 class="text-lg font-bold text-slate-900 mb-2">Producto no encontrado</h3>
                            <p class="text-xs text-slate-500 mb-6">El SKU <strong>"${skuPadreURL}"</strong> no existe en la base de datos.</p>
                            <a href="index.html" class="inline-flex items-center px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs rounded-xl transition-all">Volver al inicio</a>
                        </div>`;
                }
            } catch(e) {
                console.error("Error al obtener producto de Airtable:", e);
            }
        }

        function renderizarProducto(campos) {
            const template = document.getElementById('productoTemplate');
            const appContainer = document.getElementById('appContainer');
            appContainer.innerHTML = '';
            appContainer.appendChild(template.content.cloneNode(true));

            const nombre = campos['Nombre Comercial'] || 'Sin nombre';
            const marca = campos['Marca'] || 'Todas';
            const fotoPortada = campos['Foto Portada URL'] || '';

            document.getElementById('uiNombre').innerText = nombre;
            document.getElementById('bcActual').innerText = `${nombre} (${skuPadreURL})`;
            document.getElementById('bcMarca').innerText = marca;
            document.getElementById('bcMarca').href = `catalogo.html?marca=${marca}`;

            document.getElementById('uiMarcaBadge').innerText = marca;
            document.getElementById('uiMarcaBadge').href = `catalogo.html?marca=${marca}`;
            document.getElementById('uiSkuPadre').innerText = skuPadreURL;
            document.getElementById('catSkuPadre').innerText = skuPadreURL;
            document.getElementById('uiEstado').innerText = campos['Estado General'] || 'Activo';

            if(fotoPortada) {
                document.getElementById('mainProductImg').src = fotoPortada;
                
                // Cargar imagen en galería
                const gallery = document.getElementById('uiGalleryContainer');
                gallery.innerHTML = `
                    <div class="h-36 rounded-xl bg-slate-50 border border-slate-200/80 p-2 flex items-center justify-center">
                        <img src="${fotoPortada}" class="max-h-full max-w-full object-contain mix-blend-multiply">
                    </div>`;
            }

            // Datos Destacados
            document.getElementById('uiPeso').innerText = campos['Peso de producto'] || '-';
            document.getElementById('uiDimArmado').innerText = campos['Dimension Armado'] || '-';
            document.getElementById('uiDimBulto').innerText = campos['Dimension Bulto'] || '-';
            document.getElementById('uiDestacado1').innerText = campos['Atributo Destacado 1'] || '-';
            document.getElementById('uiDestacado2').innerText = campos['Atributo Destacado 2'] || '-';
            document.getElementById('uiLineal').innerText = campos['Lineal'] || '-';

            // Catalogación
            document.getElementById('uiBullets').innerText = campos['Bullet Points'] || 'Sin información comercial cargada.';
            document.getElementById('uiDescLarga').innerText = campos['Descripcion Larga'] || 'Sin descripción extendida cargada.';

            // Especificaciones Extendidas
            const textoFicha = campos['Ficha tecnica extendida'] || '';
            const contenedorFicha = document.getElementById('uiFichaExtendida');
            if (textoFicha) {
                const lineas = textoFicha.split('\n');
                let htmlFicha = '';
                lineas.forEach(linea => {
                    if(linea.includes(':')) {
                        const partes = linea.split(':');
                        htmlFicha += `
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="block text-[10px] font-bold uppercase tracking-wider text-slate-400">${partes[0].trim()}</span>
                                <span class="text-xs font-semibold text-slate-800 mt-0.5 block">${partes[1].trim()}</span>
                            </div>`;
                    }
                });
                contenedorFicha.innerHTML = htmlFicha;
            } else {
                contenedorFicha.innerHTML = '<div class="col-span-full text-xs text-slate-400">No hay especificaciones extendidas registradas.</div>';
            }

            // Configurar Enlaces
            configurarLink('btnFtp', campos['Link FTP General']);
            configurarLink('linkFtpRow', campos['Link FTP General'], true);
            configurarLink('uiLinkFtpFotos', campos['Link FTP General']);

            configurarLink('btnWeb', campos['URL Web Oficial']);
            if(campos['URL Web Oficial']) {
                document.getElementById('catWebLink').href = campos['URL Web Oficial'];
            }

            configurarLink('linkLifestyleRow', campos['Link Fotos Lifestyle'], true);
            configurarLink('linkManualRow', campos['Manual de Usuario'], true);
            configurarLink('linkVideoArmadoRow', campos['Link Videos Armado'], true);

            document.getElementById('btnStock').href = `https://argentrade.net/consultar_stock/?sku=${skuPadreURL}`;

            // Cálculo y Render de Porcentaje de Desarrollo
            calcularDesarrollo(campos);
        }

        function configurarLink(idElemento, url, isRow = false) {
            const el = document.getElementById(idElemento);
            if (!el) return;

            if (url) {
                el.href = url;
                if(isRow) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                }
            } else if (!isRow) {
                el.classList.add('opacity-50', 'pointer-events-none');
            }
        }

        async function buscarVariantes(idsVariantes) {
            const formulas = idsVariantes.map(id => `RECORD_ID()='${id}'`);
            const formulaFinal = encodeURIComponent(`OR(${formulas.join(',')})`);
            const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/Variantes?filterByFormula=${formulaFinal}`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${AIRTABLE_TOKEN}` }});
                const data = await res.json();
                
                const container = document.getElementById('uiVariantesContainer');
                container.innerHTML = '';

                data.records.forEach((variante, index) => {
                    const c = variante.fields;
                    const skuVar = c['SKU Variante'] || 'N/A';
                    const colorNom = c['Color / Denominación'] || 'Color';
                    const colorHex = c['Código Color Hex'] || '#cbd5e1';
                    const fotoUrl = c['Foto Principal URL'] || '';
                    const eanCode = c['EAN'] || '-';

                    if(index === 0) {
                        seleccionarVarianteVisual(skuVar, fotoUrl, eanCode);
                    }

                    const chip = document.createElement('button');
                    chip.className = `px-2.5 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-2 transition-all ${index === 0 ? 'border-brand-500 bg-brand-50 text-brand-700' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300'}`;
                    chip.innerHTML = `<span class="w-2.5 h-2.5 rounded-full border border-black/10 shadow-sm" style="background: ${colorHex};"></span> <span>${skuVar}</span>`;
                    
                    chip.onclick = function() {
                        document.querySelectorAll('#uiVariantesContainer button').forEach(btn => {
                            btn.className = 'px-2.5 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-2 transition-all border-slate-200 bg-white text-slate-700 hover:border-slate-300';
                        });
                        this.className = 'px-2.5 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-2 transition-all border-brand-500 bg-brand-50 text-brand-700';
                        seleccionarVarianteVisual(skuVar, fotoUrl, eanCode);
                    };

                    container.appendChild(chip);
                });

            } catch(e) {
                console.error("Error al buscar variantes:", e);
            }
        }

        function seleccionarVarianteVisual(skuVar, fotoUrl, eanCode = '-') {
            document.getElementById('uiSkuVariante').innerText = skuVar;
            document.getElementById('catSkuVariante').innerText = skuVar;
            document.getElementById('catEan').innerText = eanCode;
            document.getElementById('btnStock').href = `https://argentrade.net/consultar_stock/?sku=${skuVar}`;
            
            if(fotoUrl) {
                document.getElementById('mainProductImg').src = fotoUrl;
            }
        }

        // Cálculo dinámico de % de desarrollo
        function calcularDesarrollo(campos) {
            let totalPuntos = 0;
            let completados = 0;

            const verificarEtapa = (condicion, stepIndex) => {
                totalPuntos++;
                const icon = document.getElementById(`stepIcon${stepIndex}`);
                const badge = document.getElementById(`stepBadge${stepIndex}`);
                
                if (condicion) {
                    completados++;
                    if (icon) {
                        icon.className = "w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-xs";
                        icon.innerText = "✓";
                    }
                    if (badge) {
                        badge.className = "text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800";
                        badge.innerText = "Completado";
                    }
                } else if (badge) {
                    badge.className = "text-[11px] font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700";
                    badge.innerText = "Pendiente";
                }
            };

            verificarEtapa(campos['SKU Padre'] && campos['Marca'], 1);
            verificarEtapa(campos['Peso de producto'] || campos['Ficha tecnica extendida'], 2);
            verificarEtapa(campos['Foto Portada URL'] || campos['Link FTP General'], 3);
            verificarEtapa(campos['Manual de Usuario'] || campos['Link Videos Armado'], 4);
            verificarEtapa(campos['Bullet Points'] && campos['URL Web Oficial'], 5);

            const porcentaje = Math.round((completados / totalPuntos) * 100);
            
            document.getElementById('uiDesarrolloPct').innerText = `${porcentaje}%`;
            document.getElementById('uiDesarrolloBar').style.width = `${porcentaje}%`;
        }

        // Lógica de Pestañas
        function openTab(evt, tabId) {
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            
            document.getElementById(tabId).classList.remove("hidden");
            evt.currentTarget.classList.add("active");
        }

        window.onload = cargarFicha;
    </script>
